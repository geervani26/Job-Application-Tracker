<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center · Track Your Career</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f6f4ef; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* =========================================
           1. NAVIGATION BAR
           ========================================= */
        .navbar {
            width: 100%;
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            padding: 24px 6%;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-login {
            text-decoration: none;
            color: #0f172a;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.2s;
        }

        .btn-login:hover {
            color: #4f46e5;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        /* =========================================
           2. HEADLINE SECTION
           ========================================= */
        .hero-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px 20px 20px;
            flex-shrink: 0;
        }

        .hero-text h1 {
            font-size: clamp(40px, 8vh, 80px); 
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 8px;
            
            background: linear-gradient(135deg, #0f172a 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-text p {
            font-size: clamp(14px, 2.5vh, 20px);
            color: #475569;
            font-weight: 500;
            max-width: 700px;
        }

        /* =========================================
           3. IMAGE CONTAINER (Fits perfectly)
           ========================================= */
        .image-wrapper {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 0 6% 30px 6%; 
            min-height: 0; 
        }

        .hero-image {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .navbar { padding: 16px 5%; }
            .btn-login { display: none; }
            .hero-text { padding: 10px 15px; }
            .image-wrapper { padding: 0 5% 20px 5%; }
        }
    </style>
</head>
<body>

    <!-- 1. NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="auth.html" class="btn-login">Log In</a>
            <a href="auth.html?mode=register" class="btn-primary">Get Started</a>
        </div>
    </nav>

    <!-- 2. HEADLINE -->
    <div class="hero-text">
        <h1>Job Tracker</h1>
        <p>The only workspace you need to manage applications, interviews, and offers.</p>
    </div>

    <!-- 3. THE IMAGE -->
    <div class="image-wrapper">
        <!-- Ensure your image path is correct here -->
        <img src="./assets/images/Job.png" alt="Job Tracker Dashboard" class="hero-image">
    </div>

</body>
</html>
