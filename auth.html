<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In · Command Center</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f6f4ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { display: flex; width: 100%; max-width: 1000px; background: #ffffff; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); overflow: hidden; min-height: 600px; }
        
        .auth-branding { flex: 1; background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); color: white; padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; margin-bottom: 40px; color: white; text-decoration: none; }
        .logo-icon { background: rgba(255, 255, 255, 0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 20px; }
        .auth-branding h2 { font-size: 36px; line-height: 1.2; margin-bottom: 20px; letter-spacing: -1px; }
        .auth-branding p { color: rgba(255, 255, 255, 0.85); font-size: 16px; line-height: 1.6; }

        .auth-form-wrapper { flex: 1; padding: 60px 50px; display: flex; flex-direction: column; background: #ffffff; }
        .auth-tabs { display: flex; gap: 20px; margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; }
        .auth-tabs button { background: transparent; border: none; font-size: 18px; font-weight: 600; color: #64748b; padding-bottom: 12px; cursor: pointer; position: relative; transition: color 0.2s; }
        .auth-tabs button.active { color: #4f46e5; }
        .auth-tabs button.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: #4f46e5; }

        .auth-form h3 { font-size: 28px; margin-bottom: 8px; color: #0f172a; }
        .subtitle { color: #64748b; margin-bottom: 32px; font-size: 15px; }
        .input-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 14px; font-weight: 600; color: #0f172a; }
        .input-group input { padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 15px; transition: all 0.2s; background: #f8fafc; }
        .input-group input:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .btn-primary { background: #4f46e5; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px; width: 100%; }
        .btn-primary:hover { background: #4338ca; }
        .auth-error { color: #ef4444; font-size: 14px; margin-top: 12px; font-weight: 500; text-align: center; }

        @media (max-width: 768px) {
            .auth-branding { display: none; }
            .auth-container { min-height: auto; }
            .auth-form-wrapper { padding: 40px 30px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-branding">
            <a href="index.html" class="logo">
                <div class="logo-icon">🚀</div>
                <span>Command</span>
            </a>
            <h2>Your next career move starts here.</h2>
            <p>Join thousands of job seekers who organize their pipeline, track metrics, and land better offers.</p>
        </div>

        <div class="auth-form-wrapper">
            <div class="auth-tabs">
                <button id="tabLogin" class="active" onclick="switchAuthMode('login')">Log In</button>
                <button id="tabRegister" onclick="switchAuthMode('register')">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form">
                <h3>Welcome back</h3>
                <p class="subtitle">Enter your details to access your dashboard.</p>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="alex@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <p class="auth-error" id="loginError"></p>
            </form>

            <form id="registerForm" class="auth-form" style="display: none;">
                <h3>Create an account</h3>
                <p class="subtitle">Start tracking your applications today.</p>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="Alex Johnson">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="alex@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <p class="auth-error" id="registerError"></p>
            </form>
        </div>
    </div>

    <script src="landing.js"></script>
</body>
</html>
